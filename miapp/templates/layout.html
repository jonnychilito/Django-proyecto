{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}

        {% endblock %}
        | ADSO SENA
    </title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>

    <!--cabecera de la pagina-->
    <header>
        <div id="logotipo">
            <!-- logo django-->
            <img src="{% static 'images/django.png' %}" alt="Logo Django">
            <h1>Sitio WEB con Django</h1>
        </div>
    </header>

    <nav>
        <ul>
            <li>
                <a href="{% url 'index' %}">Inicio</a>
            </li>
            <li>
                <a href="{% url 'articulos' %}">Articulos</a>
            </li>
            <li>
                <a href="{% url 'hola_mundo' %}">Hola Mundo</a>
            </li>
            <li>
                <a href="{% url 'pagina' %}">Pagina de pruebas</a>
            </li>
            <li>
                <a href="{% url 'contacto' %}">Contacto</a>
            </li>
        </ul>
    </nav>

    <div id="content">
        <div class="box">
            <h1 class="title">Titulo de prueba</h1>
            {% block content %}
            <!-- Codigo que viene del template -->
            <strong>Contenido del bloque original</strong>
            {% endblock %}

        </div>
    </div>
    <hr>
    <footer>
        Curso de Python &copy; ADSO SENA - {% now "d/m/Y" %}
    </footer>

</body>

</html>
